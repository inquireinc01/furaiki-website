<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>ページが見つかりません | NPO法人フライキプロジェクト</title>
<link rel="icon" href="images/mascot.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="stylesheet" href="css/style.css?v=20260905a" />
</head>
<body class="bg-white text-[#1e1e21]">
<main class="min-h-screen flex items-center justify-center px-6">
  <div class="text-center max-w-md">
    <img src="images/mascot.png" alt="" class="h-24 w-auto mx-auto mb-6" />
    <p class="text-6xl font-black text-[#c8102e] mb-2">404</p>
    <h1 class="text-2xl font-black mb-4">ページが見つかりませんでした</h1>
    <p class="text-gray-600 leading-relaxed mb-6">
      お探しのページは移動または削除された可能性があります。<br />
      お手数ですが、下記からお進みください。
    </p>
    <div class="flex flex-wrap gap-3 justify-center mb-10">
      <a href="/" class="btn-primary inline-flex items-center px-6 py-3 rounded-full font-bold text-white">トップページへ</a>
      <a href="/about.html" class="btn-outline inline-flex items-center px-6 py-3 rounded-full font-bold">活動報告</a>
      <a href="/contact.html" class="btn-outline inline-flex items-center px-6 py-3 rounded-full font-bold">お問合せ</a>
    </div>

    <!-- GitHub Pages は /en/ 配下の見つからないURLにもこの1枚を返すため、英語も併記する -->
    <div class="border-t border-gray-200 pt-8" lang="en">
      <p class="text-lg font-black mb-3">Page Not Found</p>
      <p class="text-gray-600 leading-relaxed mb-6">
        The page you are looking for may have been moved or deleted. Please use the link below.
      </p>
      <div class="flex flex-wrap gap-3 justify-center">
        <a href="/en/" class="btn-primary inline-flex items-center px-6 py-3 rounded-full font-bold text-white">Return to Home Page</a>
        <a href="/en/about.html" class="btn-outline inline-flex items-center px-6 py-3 rounded-full font-bold">Activity Reports</a>
        <a href="/en/contact.html" class="btn-outline inline-flex items-center px-6 py-3 rounded-full font-bold">Contact Us</a>
      </div>
    </div>
  </div>
</main>

</html>
